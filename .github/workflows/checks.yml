name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: Generated docs match the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Also validates every skill's frontmatter: the generator reads the
      # manifest first and exits 2 if any skill is missing `targets:` or
      # `description:`, so a malformed skill fails here rather than silently
      # failing to ship.
      - name: Docs are current
        run: node scripts/build-docs.mjs --check

      # Severity is capped at `warning` because install-claude.sh ends with an
      # instructional echo containing a literal `$HOME`, which SC2016 flags at
      # info level and which is intentional.
      - name: shellcheck
        run: shellcheck -S warning install-claude.sh install-codex.sh statusline-command.sh

# The cross-repo sync check deliberately does NOT run here. On a PR that adds or
# edits a skill, cursor-dotfiles has not been regenerated yet — that is a
# follow-up commit in the other repo — so the check would fail on exactly the
# PRs that are doing the right thing. It runs in cursor-dotfiles instead, where
# the question "is this output current with agent-dotfiles?" is the right one to
# ask and the answer is always actionable.
